# 研究領域興隆可視化: 設定ファイル
# 語句は二重引用符なしで書く(コード側でフレーズ指定の引用符を付ける)

openalex:
  base_url: https://api.openalex.org/works
  # タイトル検索のパラメータ名。旧形式 title.search は非推奨のため使わない
  search_param: search.title
  rate_limit_per_sec: 30
  max_retries: 5
  timeout_sec: 30
  # 1リクエストあたりの推定費用(USD)と1日の上限。単価は公式の料金表で要確認
  cost_per_request_usd: 0.0001
  daily_budget_usd: 1.0

population:
  # 論文種別。null にすると種別で絞らない(論文以外の文書の増加が比率に混ざる)
  work_type: article
  year_from: 1990
  year_to: 2026   # 今年は途中経過(ダッシュボードで注記する)
  # 出現率の分母は画面で切り替える: all=全論文 / field=下の field / subfield=下の subfield
  default_denominator: all
  field_id: fields/26
  field_name: Mathematics
  subfield_id: subfields/2613
  subfield_name: Statistics and Probability

fields:
  # トピックの追加: ここに項目を足すだけでよい。語句ごとの取得結果はキャッシュされ、
  # 既存トピックは再検索されない(語句を足したときも、新しい語句の分だけ取得する)
  - label: SSM
    display_name: State space model
    phrases:
      - state space model
      - state-space model
      - dynamic linear model
  - label: HierBayes
    display_name: Hierarchical Bayes
    phrases:
      - hierarchical Bayes
      - hierarchical Bayesian
      - multilevel model
  - label: GP
    display_name: Gaussian process
    phrases:
      - Gaussian process
  - label: VI
    display_name: Variational inference
    phrases:
      - variational inference
  - label: CausalInference
    display_name: Causal inference
    phrases:
      - causal inference

sampling:
  size: 100
  seed: 20260101

# リポジトリルートからの相対パス
paths:
  cache_dir: data/cache
  output_dir: outputs
