<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究領域ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="領域ビューア">
<meta name="theme-color" content="#1c5cab">
<style>
:root {
  --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e; --grid: #e4e3df;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19; --page: #0d0d0d; --ink: #f0efec; --ink2: #c3c2b7; --grid: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
main { max-width: 960px; margin: 0 auto; padding: 16px 0 32px; }
h1 { font-size: 18px; margin: 0 0 4px; }
.meta { color: var(--ink2); font-size: 12px; margin: 0 0 12px; }
.card { background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
svg { width: 100%; aspect-ratio: 1 / 0.68; display: block; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin: 8px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink2); font-weight: 500; white-space: nowrap; }
.up { color: var(--ink); } .note { color: var(--ink2); font-size: 12px; }
#tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px; font-size: 12px; display: none; }
.wrap { position: relative; }
#error { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>研究領域興隆可視化ダッシュボード</h1>
  <p class="meta" id="meta">読み込み中…</p>
  <p id="error" class="card" hidden></p>
  <div class="card wrap"><svg id="chart" role="img" aria-label="分野別のタイトル出現率の推移"></svg><div id="tip"></div><div class="legend" id="legend"></div></div>
  <div class="card"><table id="table"></table>
    <p class="note">比率 = タイトルに語句を含む論文数 / 同一 subfield の論文数。移動平均は当該年を含む直近3年。</p></div>
</main>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
