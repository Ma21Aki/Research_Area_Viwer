<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究領域ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="領域ビューア">
<meta name="theme-color" content="#1c5cab">
<style>
:root {
  --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e; --grid: #e4e3df; --accent: #1c5cab;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19; --page: #0d0d0d; --ink: #f0efec; --ink2: #c3c2b7; --grid: #383835; --accent: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
main { max-width: 960px; margin: 0 auto; padding: 16px 0 32px; }
/* スマホ: 指標 → グラフ → 表 → トピック の順に縦に並べる */
.layout { display: flex; flex-direction: column; }
.layout > aside, .layout > section { display: contents; }
#controls { order: 1; } #status { order: 2; } #chartCard { order: 3; } #tableCard { order: 4; } #topicCard { order: 5; }
/* PC: 左に操作欄(指標・トピック)、右にグラフと表 */
@media (min-width: 1000px) {
  main { max-width: 1320px; }
  .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 0 16px; align-items: start; }
  .layout > aside, .layout > section { display: block; }
  .layout > aside { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
}
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 13px; color: var(--ink2); font-weight: 600; margin: 0 0 6px; }
.meta, .note { color: var(--ink2); font-size: 12px; margin: 0 0 12px; }
.note { margin: 8px 0 0; }
.card { background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.group { margin-bottom: 10px; } .group:last-child { margin-bottom: 0; }
button.opt, button.chip { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--grid);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
button.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .4; cursor: default; }
button.chip { display: inline-flex; align-items: center; gap: 8px; }
button.chip i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); border: 2px solid var(--c); }
button.chip[aria-pressed="false"] i { background: transparent; }
button.chip[aria-pressed="false"] { color: var(--ink2); }
svg { width: 100%; display: block; touch-action: pan-y; }
.wrap { position: relative; }
#tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px; font-size: 12px; display: none; max-width: 70%; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--ink2); font-weight: 500; }
#error, #status { color: var(--ink); }
#status { border-left: 4px solid var(--accent); }
#status.err { border-left-color: var(--s8); }
progress { width: 100%; height: 8px; accent-color: var(--accent); }
.topic { border-top: 1px solid var(--grid); padding: 8px 0; }
.topic:first-child { border-top: 0; padding-top: 0; }
.topic-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topic-row .chip { flex: 1; justify-content: flex-start; text-align: left; border: 0; padding-left: 4px; }
button.small { min-height: 36px; font-size: 13px; padding: 0 10px; }
.detail { padding: 6px 0 4px 24px; font-size: 13px; }
.detail h3 { font-size: 12px; color: var(--ink2); font-weight: 600; margin: 8px 0 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--grid); border-radius: 8px; padding: 2px 4px 2px 8px; min-height: 32px; }
.tag .n { color: var(--ink2); font-size: 12px; }
.tag button { border: 0; background: none; color: var(--ink2); font-size: 16px; min-width: 28px; min-height: 28px; cursor: pointer; }
.add { display: flex; gap: 6px; margin-top: 6px; }
.add input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--grid); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; background: var(--page); color: var(--ink); }
.danger { color: var(--s8); }
.muted { color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>研究領域興隆可視化ダッシュボード</h1>
  <p class="meta" id="meta">読み込み中…</p>
  <p id="error" class="card" hidden></p>

  <div class="layout">
  <aside>
  <div class="card" id="controls" hidden>
    <div class="group"><h2>指標</h2><div class="row" id="metrics"></div></div>
    <div class="group" id="scopeBox"><h2>集計範囲(分母)</h2><div class="row" id="scopes"></div></div>
    <div class="group"><h2>表示</h2><div class="row" id="smooth"></div></div>
  </div>

  <p id="status" class="card" hidden></p>
  <div class="card" id="topicCard" hidden>
    <h2>トピック(名前のタップで表示/非表示、詳細設定で言い換え・除外語句)</h2>
    <div id="topics"></div>
    <form class="add" id="newTopic" hidden><input name="w" placeholder="新しいトピックの見出し語句(例: particle filter)" maxlength="120" aria-label="新しいトピックの見出し語句"><button class="opt small">追加</button></form>
    <p class="note" id="topicNote"></p>
  </div>
  </aside>
  <section>

  <div class="card wrap" id="chartCard"><svg id="chart" role="img" aria-label="トピック別の推移"></svg><div id="tip"></div>
    <p class="note" id="chartNote"></p></div>
  <div class="card" id="tableCard"><table id="table"></table><p class="note" id="tableNote"></p></div>
  </section>
  </div>
</main>
<script src="app.js"></script>
<script>
// PC版(ローカルサーバー)では画面の更新をすぐ反映させたいので、オフライン用キャッシュは公開サイトだけで使う
if ("serviceWorker" in navigator && !["localhost", "127.0.0.1"].includes(location.hostname))
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
